name: Skills lifecycle validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'PROJECT_LOGIC.md'
      - 'docs/END_TO_END_PROJECT_LIFECYCLE.md'
      - 'docs/SKILL_LIBRARY_END_TO_END_VALIDATION.md'
      - 'docs/TESTING_AND_RELEASE_POLICY.md'
      - '.github/workflows/skills-validation.yml'
  push:
    branches: ['main']
    paths:
      - 'skills/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'PROJECT_LOGIC.md'
      - 'docs/END_TO_END_PROJECT_LIFECYCLE.md'
      - 'docs/SKILL_LIBRARY_END_TO_END_VALIDATION.md'
      - 'docs/TESTING_AND_RELEASE_POLICY.md'
      - '.github/workflows/skills-validation.yml'

permissions:
  contents: read

concurrency:
  group: skills-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate 91-skill lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/validation/requirements.txt
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r skills/validation/requirements.txt
      - name: Validate package structure and lifecycle wiring
        run: python skills/validation/end_to_end_skill_validator.py --repo-root . --json
      - name: Run lifecycle policy scenarios
        run: python -m pytest -q skills/validation/test_end_to_end_skill_validator.py
