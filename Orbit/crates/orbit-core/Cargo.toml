[package]
name = "orbit-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

