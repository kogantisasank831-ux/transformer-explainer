[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alphalink-mac"
version = "0.1.0"
description = "Local wireless Sony alpha camera imports for macOS"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.8.3"]

[project.optional-dependencies]
build = ["pyinstaller==6.13.0"]
test = ["pytest==8.3.5"]

[project.scripts]
alphalink = "alphalink.gui:main"

[tool.setuptools.packages.find]
include = ["alphalink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
